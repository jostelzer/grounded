  <text x="62" y="414" font-size="16.5" font-weight="700" fill="#0f172a">B. Protein-subunit vaccine (NVX-CoV2373), symptomatic COVID-19</text>
  <text x="62" y="436" font-size="12.5" fill="#5b6879">Efficacy trial, US cohort; only 12 breakthrough cases, so the intervals are wide</text>

  <line x1="180" y1="464" x2="180" y2="614" stroke="#8a95a5" stroke-width="1.4"/>
  <line x1="180" y1="614" x2="600" y2="614" stroke="#8a95a5" stroke-width="1.4"/>
  <line x1="174" y1="614" x2="180" y2="614" stroke="#8a95a5"/><text x="168" y="618" font-size="11" text-anchor="end" fill="#5b6879">0</text>
  <line x1="174" y1="581" x2="180" y2="581" stroke="#8a95a5"/><text x="168" y="585" font-size="11" text-anchor="end" fill="#5b6879">25</text>
  <line x1="174" y1="549" x2="180" y2="549" stroke="#8a95a5"/><text x="168" y="553" font-size="11" text-anchor="end" fill="#5b6879">50</text>
  <line x1="174" y1="516" x2="180" y2="516" stroke="#8a95a5"/><text x="168" y="520" font-size="11" text-anchor="end" fill="#5b6879">75</text>
  <line x1="174" y1="484" x2="180" y2="484" stroke="#8a95a5"/><text x="168" y="488" font-size="11" text-anchor="end" fill="#5b6879">100</text>
  <line x1="180" y1="484" x2="600" y2="484" stroke="#e3e8ef" stroke-width="1"/>
  <line x1="180" y1="549" x2="600" y2="549" stroke="#e3e8ef" stroke-width="1"/>
  <text x="112" y="468" font-size="11.5" font-weight="700" fill="#5b6879">efficacy</text>
  <text x="112" y="482" font-size="11.5" font-weight="700" fill="#5b6879">(%)</text>

  <!-- 75.7 (49.8-93.2) at 50; 81.7 (66.3-93.2) at 100; 96.8 (88.3-99.3) at 7230 ; y = 614 - 1.30*v -->
  <line x1="270" y1="549.3" x2="270" y2="492.8" stroke="#0d9488" stroke-width="2.2"/>
  <line x1="262" y1="549.3" x2="278" y2="549.3" stroke="#0d9488" stroke-width="2.2"/>
  <line x1="262" y1="492.8" x2="278" y2="492.8" stroke="#0d9488" stroke-width="2.2"/>
  <circle cx="270" cy="515.6" r="6" fill="#0d9488"/>
  <text x="286" y="520" font-size="12.5" font-weight="700" fill="#0f766e">75.7%</text>

  <line x1="390" y1="527.8" x2="390" y2="492.8" stroke="#0d9488" stroke-width="2.2"/>
  <line x1="382" y1="527.8" x2="398" y2="527.8" stroke="#0d9488" stroke-width="2.2"/>
  <line x1="382" y1="492.8" x2="398" y2="492.8" stroke="#0d9488" stroke-width="2.2"/>
  <circle cx="390" cy="507.8" r="6" fill="#0d9488"/>
  <text x="406" y="512" font-size="12.5" font-weight="700" fill="#0f766e">81.7%</text>

  <line x1="510" y1="499.2" x2="510" y2="484.9" stroke="#0d9488" stroke-width="2.2"/>
  <line x1="502" y1="499.2" x2="518" y2="499.2" stroke="#0d9488" stroke-width="2.2"/>
  <line x1="502" y1="484.9" x2="518" y2="484.9" stroke="#0d9488" stroke-width="2.2"/>
  <circle cx="510" cy="488.2" r="6" fill="#0d9488"/>
  <text x="526" y="493" font-size="12.5" font-weight="700" fill="#0f766e">96.8%</text>

  <text x="270" y="633" font-size="12" text-anchor="middle" fill="#24303f">50</text>
  <text x="390" y="633" font-size="12" text-anchor="middle" fill="#24303f">100</text>
  <text x="510" y="633" font-size="12" text-anchor="middle" fill="#24303f">7,230</text>
  <text x="390" y="650" font-size="11.5" text-anchor="middle" fill="#5b6879">neutralising antibody, IU50/ml (marked levels only, not to scale)</text>

  <text x="628" y="480" font-size="12.5" fill="#24303f">The same rising relationship</text>
  <text x="628" y="498" font-size="12.5" fill="#24303f">appears in a vaccine that is not</text>
  <text x="628" y="516" font-size="12.5" fill="#24303f">RNA-based at all — the marker</text>
  <text x="628" y="534" font-size="12.5" fill="#24303f">travels across platforms, which</text>
  <text x="628" y="552" font-size="12.5" fill="#24303f">is why regulators use it to judge</text>
  <text x="628" y="570" font-size="12.5" fill="#24303f">updated vaccines without a new</text>
  <text x="628" y="588" font-size="12.5" fill="#24303f">efficacy trial.</text>

  <!-- ================= PANEL C ================= -->
  <rect x="40" y="668" width="820" height="300" rx="12" fill="#fffbeb" stroke="#f0c974"/>
  <text x="62" y="698" font-size="16.5" font-weight="700" fill="#0f172a">C. Severe disease is protected even at antibody levels too low to measure</text>
  <text x="62" y="720" font-size="12.5" fill="#5b6879">Vector vaccine (Ad26.COV2.S) efficacy trial; 42 severe-critical breakthrough cases to 220 days</text>

  <line x1="180" y1="748" x2="180" y2="898" stroke="#8a95a5" stroke-width="1.4"/>
  <line x1="180" y1="898" x2="600" y2="898" stroke="#8a95a5" stroke-width="1.4"/>
  <line x1="174" y1="898" x2="180" y2="898" stroke="#8a95a5"/><text x="168" y="902" font-size="11" text-anchor="end" fill="#5b6879">0</text>
  <line x1="174" y1="865" x2="180" y2="865" stroke="#8a95a5"/><text x="168" y="869" font-size="11" text-anchor="end" fill="#5b6879">25</text>
  <line x1="174" y1="833" x2="180" y2="833" stroke="#8a95a5"/><text x="168" y="837" font-size="11" text-anchor="end" fill="#5b6879">50</text>
  <line x1="174" y1="800" x2="180" y2="800" stroke="#8a95a5"/><text x="168" y="804" font-size="11" text-anchor="end" fill="#5b6879">75</text>
  <line x1="174" y1="768" x2="180" y2="768" stroke="#8a95a5"/><text x="168" y="772" font-size="11" text-anchor="end" fill="#5b6879">100</text>
  <line x1="180" y1="768" x2="600" y2="768" stroke="#eadfc4" stroke-width="1"/>
  <line x1="180" y1="833" x2="600" y2="833" stroke="#eadfc4" stroke-width="1"/>
  <text x="112" y="752" font-size="11.5" font-weight="700" fill="#5b6879">efficacy</text>
  <text x="112" y="766" font-size="11.5" font-weight="700" fill="#5b6879">(%)</text>

  <!-- severe-critical: 63.1 (40.0-77.3); 85.2 (47.2-95.3); 95.1 (81.1-96.9)   y = 898 - 1.30*v  -->
  <line x1="262" y1="846" x2="262" y2="797.5" stroke="#b45309" stroke-width="2.2"/>
  <line x1="254" y1="846" x2="270" y2="846" stroke="#b45309" stroke-width="2.2"/>
  <line x1="254" y1="797.5" x2="270" y2="797.5" stroke="#b45309" stroke-width="2.2"/>
  <circle cx="262" cy="815.97" r="6" fill="#b45309"/>
  <text x="246" y="820" font-size="12" font-weight="700" text-anchor="end" fill="#92400e">63.1%</text>

  <line x1="382" y1="836.6" x2="382" y2="774.1" stroke="#b45309" stroke-width="2.2"/>
  <line x1="374" y1="836.6" x2="390" y2="836.6" stroke="#b45309" stroke-width="2.2"/>
  <line x1="374" y1="774.1" x2="390" y2="774.1" stroke="#b45309" stroke-width="2.2"/>
  <circle cx="382" cy="787.24" r="6" fill="#b45309"/>
  <text x="366" y="792" font-size="12" font-weight="700" text-anchor="end" fill="#92400e">85.2%</text>

  <line x1="502" y1="792.6" x2="502" y2="772" stroke="#b45309" stroke-width="2.2"/>
  <line x1="494" y1="792.6" x2="510" y2="792.6" stroke="#b45309" stroke-width="2.2"/>
  <line x1="494" y1="772" x2="510" y2="772" stroke="#b45309" stroke-width="2.2"/>
  <circle cx="502" cy="774.37" r="6" fill="#b45309"/>
  <text x="486" y="779" font-size="12" font-weight="700" text-anchor="end" fill="#92400e">95.1%</text>

  <!-- moderate: 32.5 (11.8-48.4); 33.9 (19.1-59.3); 60.7 (40.4-76.4) -->
  <line x1="298" y1="882.7" x2="298" y2="835.1" stroke="#7c3aed" stroke-width="2.2" stroke-dasharray="4 3"/>
  <line x1="290" y1="882.7" x2="306" y2="882.7" stroke="#7c3aed" stroke-width="2.2"/>
  <line x1="290" y1="835.1" x2="306" y2="835.1" stroke="#7c3aed" stroke-width="2.2"/>
