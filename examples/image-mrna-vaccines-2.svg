<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="850" viewBox="0 0 1000 850" role="img" aria-labelledby="title desc">
  <title id="title">Protection wanes faster against infection than severe disease</title>
  <desc id="desc">A horizontal interval plot shows an average 21 percentage-point decline against infection and 10-point decline against severe disease from month one to month six, with 95 percent confidence intervals. Three evidence cards describe strong circulating memory, limited airway immunity, and variant escape as supported but quantitatively unpartitioned explanations.</desc>
  <defs>
    <style>
      .bg{fill:#f7f4ed}.ink{fill:#17324d}.muted{fill:#587085}.title{font:700 38px Arial,sans-serif}.subtitle{font:400 20px Arial,sans-serif}.head{font:700 22px Arial,sans-serif}.label{font:600 19px Arial,sans-serif}.body{font:400 17px Arial,sans-serif}.small{font:400 15px Arial,sans-serif}.gloss{font:400 18px Arial,sans-serif}.glosshead{font:700 19px Arial,sans-serif}.grid{stroke:#ccd7df;stroke-width:2}.axis{stroke:#6c8191;stroke-width:3}.ci{stroke:#17324d;stroke-width:8;stroke-linecap:round}.cap{stroke:#17324d;stroke-width:3}.point1{fill:#177e89;stroke:#fff;stroke-width:4}.point2{fill:#3366a8;stroke:#fff;stroke-width:4}
    </style>
  </defs>
  <rect class="bg" width="1000" height="850"/>
  <g id="title-band">
    <text class="title ink" x="50" y="52">Protection wanes faster against infection</text>
    <text class="subtitle muted" x="50" y="82">Average decline from month 1 to month 6 · pre-Omicron systematic review</text>
    <line x1="50" y1="102" x2="950" y2="102" stroke="#9eb2c1" stroke-width="2"/>
  </g>

  <g id="plot-panel">
    <rect x="50" y="130" width="610" height="440" rx="18" fill="#fff" stroke="#c8d5df" stroke-width="2"/>
    <text class="head ink" x="80" y="170">Decline in vaccine effectiveness</text>
    <text class="small muted" x="80" y="198">Percentage points; dot = estimate, line = 95% confidence interval</text>

    <line class="grid" x1="120" y1="235" x2="120" y2="485"/>
    <line class="grid" x1="257" y1="235" x2="257" y2="485"/>
    <line class="grid" x1="394" y1="235" x2="394" y2="485"/>
    <line class="grid" x1="531" y1="235" x2="531" y2="485"/>
    <line class="axis" x1="120" y1="485" x2="600" y2="485"/>
    <text class="small muted" x="120" y="515" text-anchor="middle">0</text>
    <text class="small muted" x="257" y="515" text-anchor="middle">10</text>
    <text class="small muted" x="394" y="515" text-anchor="middle">20</text>
    <text class="small muted" x="531" y="515" text-anchor="middle">30</text>
    <text class="small muted" x="360" y="548" text-anchor="middle">Percentage-point decline</text>

    <text class="label ink" x="105" y="294" text-anchor="end">Infection</text>
    <line class="ci" x1="311" y1="287" x2="529" y2="287"/>
    <line class="cap" x1="311" y1="275" x2="311" y2="299"/><line class="cap" x1="529" y1="275" x2="529" y2="299"/>
    <circle class="point1" cx="408" cy="287" r="13"/>
    <rect x="385" y="316" width="158" height="58" rx="10" fill="#e5f3f1"/>
    <text class="label ink" x="464" y="341" text-anchor="middle">21.0 points</text>
    <text class="small muted" x="464" y="362" text-anchor="middle">95% CI 13.9-29.8</text>

    <text class="label ink" x="105" y="424" text-anchor="end"><tspan x="105">Severe</tspan><tspan x="105" dy="22">disease</tspan></text>
    <line class="ci" x1="204" y1="417" x2="331" y2="417"/>
    <line class="cap" x1="204" y1="405" x2="204" y2="429"/><line class="cap" x1="331" y1="405" x2="331" y2="429"/>
    <circle class="point2" cx="257" cy="417" r="13"/>
    <rect x="350" y="388" width="168" height="58" rx="10" fill="#eaf2fb"/>
    <text class="label ink" x="434" y="413" text-anchor="middle">10.0 points</text>
    <text class="small muted" x="434" y="434" text-anchor="middle">95% CI 6.1-15.4</text>
  </g>

  <g id="interpretation-panel">
    <rect x="685" y="130" width="265" height="440" rx="18" fill="#fff" stroke="#c8d5df" stroke-width="2"/>
    <text class="head ink" x="715" y="170">Supported explanations</text>
    <text class="small muted" x="715" y="198"><tspan x="715">These studies do not assign</tspan><tspan x="715" dy="20">a percentage to each cause.</tspan></text>

    <rect x="710" y="235" width="215" height="82" rx="12" fill="#e5f3f1"/>
    <circle cx="735" cy="260" r="10" fill="#177e89"/>
    <text class="label ink" x="756" y="266">Circulating memory</text>
    <text class="small muted" x="735" y="291"><tspan x="735">B and T cells can limit</tspan><tspan x="735" dy="19">progression after infection.</tspan></text>

    <rect x="710" y="335" width="215" height="82" rx="12" fill="#fff3dc"/>
    <circle cx="735" cy="360" r="10" fill="#e6a23c"/>
    <text class="label ink" x="756" y="366">Airway gap</text>
    <text class="small muted" x="735" y="391"><tspan x="735">Injected vaccine elicits</tspan><tspan x="735" dy="19">limited local airway immunity.</tspan></text>

    <rect x="710" y="435" width="215" height="105" rx="12" fill="#f9e8ed"/>
    <circle cx="735" cy="460" r="10" fill="#c85d78"/>
    <text class="label ink" x="756" y="466">Variant escape</text>
    <text class="small muted" x="735" y="491"><tspan x="735">Changed spike can evade</tspan><tspan x="735" dy="19">existing antibodies; strain</tspan><tspan x="735" dy="19">updates only partly catch up.</tspan></text>
  </g>

  <g id="glossary-band">
    <rect x="50" y="610" width="900" height="195" rx="16" fill="#eef1f2" stroke="#b8c7d1" stroke-width="2"/>
    <text class="glosshead ink" x="75" y="644">GLOSSARY AND UNCERTAINTY</text>
    <text class="gloss ink" x="75" y="678"><tspan font-weight="700">Vaccine effectiveness</tspan><tspan> · reduction in outcome risk under real-world conditions.</tspan></text>
    <text class="gloss ink" x="75" y="710"><tspan font-weight="700">Percentage point</tspan><tspan> · an absolute change in percentages; 80% to 60% is a 20-point fall.</tspan></text>
    <text class="gloss ink" x="75" y="742"><tspan font-weight="700">95% CI</tspan><tspan> · confidence interval; a range expressing statistical uncertainty around an estimate.</tspan></text>
    <text class="gloss ink" x="75" y="774"><tspan font-weight="700">Pre-Omicron</tspan><tspan> · all included evidence preceded widespread Omicron, so later variants may differ.</tspan></text>
  </g>
</svg>
