<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1215" width="900" height="1215" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif">
  <title>How much protection each antibody level bought, in three vaccine trials</title>
  <desc>Three stacked panels. In each, vaccine efficacy against COVID-19 is plotted against the neutralising antibody level measured after vaccination, at the three levels each trial reported, with 95 percent confidence intervals. Efficacy rises with antibody level in all three trials. In the third panel, protection against severe disease stays high even when antibody is below the assay's detection limit, while protection against moderate disease does not.</desc>

  <rect x="0" y="0" width="900" height="1215" fill="#ffffff"/>

  <!-- ===== Header ===== -->
  <text x="40" y="44" font-size="25" font-weight="700" fill="#0f172a">More antibody, more protection — but antibody is not the whole story</text>
  <text x="40" y="72" font-size="14" fill="#5b6879">Vaccine efficacy at the antibody levels each trial reported. Bars show 95% confidence intervals.</text>
  <line x1="40" y1="88" x2="860" y2="88" stroke="#d7dee8" stroke-width="1"/>

  <!-- ================= PANEL A ================= -->
  <rect x="40" y="100" width="820" height="272" rx="12" fill="#f6f8fb" stroke="#d7dee8"/>
  <text x="62" y="130" font-size="16.5" font-weight="700" fill="#0f172a">A. mRNA vaccine (mRNA-1273), symptomatic COVID-19</text>
  <text x="62" y="152" font-size="12.5" fill="#5b6879">Efficacy trial, 30,420 people; antibody measured 4 weeks after the second dose</text>

  <!-- axes -->
  <line x1="180" y1="180" x2="180" y2="330" stroke="#8a95a5" stroke-width="1.4"/>
  <line x1="180" y1="330" x2="600" y2="330" stroke="#8a95a5" stroke-width="1.4"/>
  <!-- y ticks: 0,25,50,75,100 -> y=330,297.5,265,232.5,200 (1.3 px per %) -->
  <line x1="174" y1="330" x2="180" y2="330" stroke="#8a95a5"/><text x="168" y="334" font-size="11" text-anchor="end" fill="#5b6879">0</text>
  <line x1="174" y1="297" x2="180" y2="297" stroke="#8a95a5"/><text x="168" y="301" font-size="11" text-anchor="end" fill="#5b6879">25</text>
  <line x1="174" y1="265" x2="180" y2="265" stroke="#8a95a5"/><text x="168" y="269" font-size="11" text-anchor="end" fill="#5b6879">50</text>
  <line x1="174" y1="232" x2="180" y2="232" stroke="#8a95a5"/><text x="168" y="236" font-size="11" text-anchor="end" fill="#5b6879">75</text>
  <line x1="174" y1="200" x2="180" y2="200" stroke="#8a95a5"/><text x="168" y="204" font-size="11" text-anchor="end" fill="#5b6879">100</text>
  <line x1="180" y1="200" x2="600" y2="200" stroke="#e3e8ef" stroke-width="1"/>
  <line x1="180" y1="265" x2="600" y2="265" stroke="#e3e8ef" stroke-width="1"/>
  <text x="112" y="184" font-size="11.5" font-weight="700" fill="#5b6879">efficacy</text>
  <text x="112" y="198" font-size="11.5" font-weight="700" fill="#5b6879">(%)</text>

  <!-- data: 78 (54-89) at 10; 91 (87-94) at 100; 96 (94-98) at 1000 -->
  <!-- y = 330 - 1.30*v -->
  <line x1="270" y1="260.2" x2="270" y2="184.7" stroke="#2563eb" stroke-width="2.2"/>
  <line x1="262" y1="260.2" x2="278" y2="260.2" stroke="#2563eb" stroke-width="2.2"/>
  <line x1="262" y1="184.7" x2="278" y2="184.7" stroke="#2563eb" stroke-width="2.2"/>
  <circle cx="270" cy="228.6" r="6" fill="#2563eb"/>
  <text x="286" y="233" font-size="12.5" font-weight="700" fill="#1d4ed8">78%</text>

  <line x1="390" y1="216.9" x2="390" y2="207.8" stroke="#2563eb" stroke-width="2.2"/>
  <line x1="382" y1="216.9" x2="398" y2="216.9" stroke="#2563eb" stroke-width="2.2"/>
  <line x1="382" y1="207.8" x2="398" y2="207.8" stroke="#2563eb" stroke-width="2.2"/>
  <circle cx="390" cy="211.7" r="6" fill="#2563eb"/>
  <text x="406" y="216" font-size="12.5" font-weight="700" fill="#1d4ed8">91%</text>

  <line x1="510" y1="207.8" x2="510" y2="202.6" stroke="#2563eb" stroke-width="2.2"/>
  <line x1="502" y1="207.8" x2="518" y2="207.8" stroke="#2563eb" stroke-width="2.2"/>
  <line x1="502" y1="202.6" x2="518" y2="202.6" stroke="#2563eb" stroke-width="2.2"/>
  <circle cx="510" cy="205.2" r="6" fill="#2563eb"/>
  <text x="526" y="210" font-size="12.5" font-weight="700" fill="#1d4ed8">96%</text>

  <text x="270" y="349" font-size="12" text-anchor="middle" fill="#24303f">10</text>
  <text x="390" y="349" font-size="12" text-anchor="middle" fill="#24303f">100</text>
  <text x="510" y="349" font-size="12" text-anchor="middle" fill="#24303f">1,000</text>
  <text x="390" y="366" font-size="11.5" text-anchor="middle" fill="#5b6879">50% neutralisation titre (marked levels only, not to scale)</text>

  <text x="628" y="196" font-size="12.5" fill="#24303f">A hundredfold more antibody</text>
  <text x="628" y="214" font-size="12.5" fill="#24303f">took efficacy from 78% to 96%.</text>
  <text x="628" y="240" font-size="12.5" fill="#24303f">The intervals are widest at the</text>
  <text x="628" y="258" font-size="12.5" fill="#24303f">lowest level, where the fewest</text>
  <text x="628" y="276" font-size="12.5" fill="#24303f">people sat.</text>

  <!-- ================= PANEL B ================= -->
