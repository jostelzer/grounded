  <text x="314" y="860" font-size="12" font-weight="700" fill="#6b21a8">32.5%</text>

  <line x1="418" y1="873.2" x2="418" y2="820.9" stroke="#7c3aed" stroke-width="2.2" stroke-dasharray="4 3"/>
  <line x1="410" y1="873.2" x2="426" y2="873.2" stroke="#7c3aed" stroke-width="2.2"/>
  <line x1="410" y1="820.9" x2="426" y2="820.9" stroke="#7c3aed" stroke-width="2.2"/>
  <rect x="412.5" y="848.43" width="11" height="11" fill="#7c3aed"/>
  <text x="434" y="858" font-size="12" font-weight="700" fill="#6b21a8">33.9%</text>

  <line x1="538" y1="845.5" x2="538" y2="798.7" stroke="#7c3aed" stroke-width="2.2" stroke-dasharray="4 3"/>
  <line x1="530" y1="845.5" x2="546" y2="845.5" stroke="#7c3aed" stroke-width="2.2"/>
  <line x1="530" y1="798.7" x2="546" y2="798.7" stroke="#7c3aed" stroke-width="2.2"/>
  <rect x="532.5" y="813.59" width="11" height="11" fill="#7c3aed"/>
  <text x="554" y="823" font-size="12" font-weight="700" fill="#6b21a8">60.7%</text>

  <text x="280" y="917" font-size="12" text-anchor="middle" fill="#24303f">below assay limit</text>
  <text x="280" y="932" font-size="11" text-anchor="middle" fill="#5b6879">(under 4.9)</text>
  <text x="400" y="917" font-size="12" text-anchor="middle" fill="#24303f">5.2</text>
  <text x="520" y="917" font-size="12" text-anchor="middle" fill="#24303f">30.2</text>
  <text x="400" y="951" font-size="11.5" text-anchor="middle" fill="#5b6879">neutralising antibody, IU50/ml (marked levels only, not to scale)</text>

  <!-- legend + note -->
  <circle cx="640" cy="757" r="6" fill="#b45309"/>
  <text x="654" y="762" font-size="12.5" font-weight="700" fill="#92400e">severe or critical COVID-19</text>
  <rect x="634.5" y="774.5" width="11" height="11" fill="#7c3aed"/>
  <text x="654" y="784" font-size="12.5" font-weight="700" fill="#6b21a8">moderate COVID-19</text>

  <text x="628" y="812" font-size="12.5" fill="#24303f">With no measurable antibody at</text>
  <text x="628" y="830" font-size="12.5" fill="#24303f">all, severe disease was still cut</text>
  <text x="628" y="848" font-size="12.5" fill="#24303f">by 63%, while moderate disease</text>
  <text x="628" y="866" font-size="12.5" fill="#24303f">was cut by only 33%. Just 28.6%</text>
  <text x="628" y="884" font-size="12.5" fill="#24303f">of the vaccine's total effect was</text>
  <text x="628" y="902" font-size="12.5" fill="#24303f">explained by antibody level, so</text>
  <text x="628" y="920" font-size="12.5" fill="#24303f">other immunity — probably</text>
  <text x="628" y="938" font-size="12.5" fill="#24303f">T cells — carries the rest.</text>

  <!-- ================= GLOSSARY ================= -->
  <rect x="40" y="980" width="820" height="205" rx="12" fill="#f2f5fa" stroke="#c9d4e2"/>
  <text x="62" y="1008" font-size="14" font-weight="700" fill="#0f172a">Glossary — plain-language meaning of every term in this figure</text>

  <text x="62" y="1032" font-size="12" fill="#24303f"><tspan font-weight="700">Vaccine efficacy</tspan> — how much less often disease occurred in the</text>
  <text x="62" y="1048" font-size="12" fill="#24303f">vaccinated group than in the placebo group, as a percentage.</text>
  <text x="62" y="1068" font-size="12" fill="#24303f"><tspan font-weight="700">Neutralising antibody</tspan> — antibody that blocks the virus from</text>
  <text x="62" y="1084" font-size="12" fill="#24303f">entering cells, measured in a laboratory test.</text>
  <text x="62" y="1104" font-size="12" fill="#24303f"><tspan font-weight="700">50% neutralisation titre / IU50/ml</tspan> — how much a blood sample</text>
  <text x="62" y="1120" font-size="12" fill="#24303f">can be diluted and still block half the virus; IU50/ml is the same</text>
  <text x="62" y="1136" font-size="12" fill="#24303f">idea on an international scale, so labs can be compared.</text>
  <text x="62" y="1156" font-size="12" fill="#24303f"><tspan font-weight="700">95% confidence interval</tspan> — the range the true value plausibly</text>
  <text x="62" y="1172" font-size="12" fill="#24303f">lies in; drawn here as the vertical bar through each point.</text>

  <text x="470" y="1032" font-size="12" fill="#24303f"><tspan font-weight="700">Below assay limit</tspan> — antibody too low for the test to measure;</text>
  <text x="470" y="1048" font-size="12" fill="#24303f">not the same as none at all.</text>
  <text x="470" y="1068" font-size="12" fill="#24303f"><tspan font-weight="700">Protein-subunit and vector vaccines</tspan> — non-RNA vaccines shown</text>
  <text x="470" y="1084" font-size="12" fill="#24303f">for comparison: one injects the protein itself, the other delivers</text>
  <text x="470" y="1100" font-size="12" fill="#24303f">the gene inside a harmless carrier virus.</text>
  <text x="470" y="1120" font-size="12" fill="#24303f"><tspan font-weight="700">Dashed bars, purple squares</tspan> — the milder-disease series in</text>
  <text x="470" y="1136" font-size="12" fill="#24303f">panel C, kept visually distinct from the severe-disease series.</text>
  <text x="470" y="1156" font-size="12" fill="#24303f"><tspan font-weight="700">Not to scale</tspan> — only the antibody levels each trial reported are</text>
  <text x="470" y="1172" font-size="12" fill="#24303f">shown, spaced evenly; no curve is fitted between them.</text>
</svg>
