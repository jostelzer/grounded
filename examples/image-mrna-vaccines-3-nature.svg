<svg xmlns="http://www.w3.org/2000/svg" width="1536" height="1024" viewBox="0 0 1536 1024" role="img" aria-labelledby="title desc">
  <title id="title">Myocarditis risk is concentrated, not uniform</title>
  <desc id="desc">Two mathematically scaled dot-and-whisker panels. Panel a shows pooled myocarditis cases per million adolescent vaccine doses by sex and dose on a 0 to 120 scale. Panel b shows excess cases per million vaccinated Nordic males aged 16 to 24 after dose 2 by vaccine product on a 0 to 300 scale. The panels use different denominators and must not be compared directly.</desc>
  <metadata>Panel a: Male 66.0 (95% CI 40.5–107.7); Female 10.1 (6.0–17.0); Dose 2 60.4 (37.6–96.9); Dose 1 16.6 (8.7–31.9) cases per million vaccine doses. Panel b: BNT162b2 55.5 (37.0–73.9); mRNA-1273 183.9 (90.5–277.2) excess cases per million vaccinated after dose 2.</metadata>
  <defs>
    <style>
      .text{font-family:Arial,Helvetica,sans-serif;fill:#1a1a1a}
      .panel-letter{font-size:27px;font-weight:700}
      .panel-title{font-size:25px;font-weight:700}
      .label{font-size:21px;font-weight:400}
      .axis-label{font-size:20px;font-weight:400}
      .tick{font-size:18px;font-weight:400}
      .scope{font-size:18px;font-weight:400;fill:#666666}
      .note{font-size:18px;font-weight:400;fill:#555555}
      .note-strong{font-size:18px;font-weight:700;fill:#444444}
      .estimate{font-size:19px;font-weight:700}
      .axis{stroke:#2f2f2f;stroke-width:2.2;fill:none}
      .divider{stroke:#d9d9d9;stroke-width:1.5}
      .ci{stroke:#5b8db8;stroke-width:3.5;stroke-linecap:round}
      .cap{stroke:#5b8db8;stroke-width:2.5}
      .point{fill:#5b8db8;stroke:#ffffff;stroke-width:2.5}
      .group-rule{stroke:#e7e7e7;stroke-width:1.2}
    </style>
  </defs>

  <rect width="1536" height="1024" fill="#ffffff"/>

  <line class="divider" x1="768" y1="48" x2="768" y2="936"/>

  <text class="text panel-letter" x="54" y="84">a</text>
  <text class="text panel-title" x="91" y="84">Pooled adolescents, age 12–17</text>
  <text class="text scope" x="91" y="118">15 observational studies · 39.6 million doses</text>

  <text class="text label" x="54" y="254">Male</text>
  <line class="ci" x1="327.125" y1="246" x2="657.525" y2="246"/>
  <line class="cap" x1="327.125" y1="236" x2="327.125" y2="256"/>
  <line class="cap" x1="657.525" y1="236" x2="657.525" y2="256"/>
  <circle class="point" cx="452.5" cy="246" r="9"/>
  <text class="text estimate" x="452.5" y="217" text-anchor="middle">66.0</text>

  <text class="text label" x="54" y="369">Female</text>
  <line class="ci" x1="157.5" y1="361" x2="211.583333" y2="361"/>
  <line class="cap" x1="157.5" y1="351" x2="157.5" y2="371"/>
  <line class="cap" x1="211.583333" y1="351" x2="211.583333" y2="371"/>
  <circle class="point" cx="177.658333" cy="361" r="9"/>
  <text class="text estimate" x="177.658333" y="332" text-anchor="middle">10.1</text>

  <line class="group-rule" x1="54" y1="430" x2="718" y2="430"/>

  <text class="text label" x="54" y="524">Dose 2</text>
  <line class="ci" x1="312.866667" y1="516" x2="604.425" y2="516"/>
  <line class="cap" x1="312.866667" y1="506" x2="312.866667" y2="526"/>
  <line class="cap" x1="604.425" y1="506" x2="604.425" y2="526"/>
  <circle class="point" cx="424.966667" cy="516" r="9"/>
  <text class="text estimate" x="424.966667" y="487" text-anchor="middle">60.4</text>

  <text class="text label" x="54" y="639">Dose 1</text>
  <line class="ci" x1="170.775" y1="631" x2="284.841667" y2="631"/>
  <line class="cap" x1="170.775" y1="621" x2="170.775" y2="641"/>
  <line class="cap" x1="284.841667" y1="621" x2="284.841667" y2="641"/>
  <circle class="point" cx="209.616667" cy="631" r="9"/>
  <text class="text estimate" x="209.616667" y="602" text-anchor="middle">16.6</text>

  <line class="axis" x1="128" y1="720" x2="718" y2="720"/>
  <g class="text tick" text-anchor="middle">
    <line class="axis" x1="128" y1="720" x2="128" y2="731"/><text x="128" y="759">0</text>
    <line class="axis" x1="226.333333" y1="720" x2="226.333333" y2="731"/><text x="226.333333" y="759">20</text>
    <line class="axis" x1="324.666667" y1="720" x2="324.666667" y2="731"/><text x="324.666667" y="759">40</text>
    <line class="axis" x1="423" y1="720" x2="423" y2="731"/><text x="423" y="759">60</text>
    <line class="axis" x1="521.333333" y1="720" x2="521.333333" y2="731"/><text x="521.333333" y="759">80</text>
    <line class="axis" x1="619.666667" y1="720" x2="619.666667" y2="731"/><text x="619.666667" y="759">100</text>
    <line class="axis" x1="718" y1="720" x2="718" y2="731"/><text x="718" y="759">120</text>
  </g>
  <text class="text axis-label" x="423" y="805" text-anchor="middle">Cases per million vaccine doses</text>
  <text class="text note" x="54" y="861">Panel a = observed cases per million vaccine doses</text>
  <text class="text note" x="54" y="899">Sex and dose are separate pooled subgroup analyses</text>

  <text class="text panel-letter" x="808" y="84">b</text>
  <text class="text panel-title" x="845" y="84">Nordic males, age 16–24</text>
  <text class="text scope" x="845" y="118">Four linked national cohorts · 28-day window</text>
  <text class="text note-strong" x="1478" y="166" text-anchor="end">Do not compare magnitudes across panels</text>

  <text class="text label" x="780" y="334">BNT162b2</text>
  <line class="ci" x1="894.14" y1="326" x2="976.058" y2="326"/>
  <line class="cap" x1="894.14" y1="316" x2="894.14" y2="336"/>
  <line class="cap" x1="976.058" y1="316" x2="976.058" y2="336"/>
  <circle class="point" cx="935.21" cy="326" r="9"/>
  <text class="text estimate" x="935.21" y="297" text-anchor="middle">55.5</text>

  <text class="text label" x="780" y="569">mRNA-1273</text>
  <line class="ci" x1="1012.91" y1="561" x2="1427.384" y2="561"/>
  <line class="cap" x1="1012.91" y1="551" x2="1012.91" y2="571"/>
  <line class="cap" x1="1427.384" y1="551" x2="1427.384" y2="571"/>
  <circle class="point" cx="1220.258" cy="561" r="9"/>
  <text class="text estimate" x="1220.258" y="532" text-anchor="middle">183.9</text>

  <line class="axis" x1="812" y1="720" x2="1478" y2="720"/>
  <g class="text tick" text-anchor="middle">
    <line class="axis" x1="812" y1="720" x2="812" y2="731"/><text x="812" y="759">0</text>
    <line class="axis" x1="923" y1="720" x2="923" y2="731"/><text x="923" y="759">50</text>
    <line class="axis" x1="1034" y1="720" x2="1034" y2="731"/><text x="1034" y="759">100</text>
    <line class="axis" x1="1145" y1="720" x2="1145" y2="731"/><text x="1145" y="759">150</text>
    <line class="axis" x1="1256" y1="720" x2="1256" y2="731"/><text x="1256" y="759">200</text>
    <line class="axis" x1="1367" y1="720" x2="1367" y2="731"/><text x="1367" y="759">250</text>
    <line class="axis" x1="1478" y1="720" x2="1478" y2="731"/><text x="1478" y="759">300</text>
  </g>
  <text class="text axis-label" x="1145" y="805" text-anchor="middle">Excess cases per million vaccinated after dose 2</text>
  <text class="text note" x="808" y="861">Panel b = excess cases per million vaccinated people</text>
  <g aria-label="Confidence interval legend">
    <line class="ci" x1="808" y1="897" x2="874" y2="897"/>
    <line class="cap" x1="808" y1="889" x2="808" y2="905"/>
    <line class="cap" x1="874" y1="889" x2="874" y2="905"/>
    <circle class="point" cx="841" cy="897" r="7"/>
    <text class="text note" x="891" y="904">95% CI = confidence interval</text>
  </g>
</svg>
