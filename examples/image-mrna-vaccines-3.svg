<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1210" width="900" height="1210" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif">
  <title>How rare is myocarditis after mRNA vaccination?</title>
  <desc>Three horizontal bar panels and a summary strip. Panel A pools 39.6 million doses in 12 to 17 year olds: 43.5 myopericarditis cases per million doses overall, 66.0 in males against 10.1 in females, and 60.4 after the second dose against 16.6 after the first. Panel B shows United States reporting rates by age and sex, peaking at 105.9 per million second doses in males aged 16 to 17. Panel C compares 10 excess cases per million people in the 28 days after a second mRNA-1273 dose with 40 per million after a positive SARS-CoV-2 test. A strip summarises the clinical course and a glossary band defines every term.</desc>

  <rect x="0" y="0" width="900" height="1210" fill="#ffffff"/>

  <!-- ===== Header ===== -->
  <text x="40" y="44" font-size="25" font-weight="700" fill="#0f172a">How rare is myocarditis after mRNA vaccination?</text>
  <text x="40" y="72" font-size="14" fill="#5b6879">Cases per million, from three independent datasets. The three panels use two different denominators — see the glossary.</text>
  <line x1="40" y1="88" x2="860" y2="88" stroke="#d7dee8" stroke-width="1"/>

  <!-- ================= PANEL A ================= -->
  <rect x="40" y="100" width="820" height="310" rx="12" fill="#f6f8fb" stroke="#d7dee8"/>
  <text x="62" y="130" font-size="16.5" font-weight="700" fill="#0f172a">A. Pooled across 39.6 million doses given to 12–17-year-olds</text>
  <text x="62" y="152" font-size="12.5" fill="#5b6879">Meta-analysis of 15 observational studies; bars show 95% confidence intervals</text>

  <!-- gridlines -->
  <line x1="450" y1="170" x2="450" y2="356" stroke="#e3e8ef" stroke-width="1"/>
  <line x1="570" y1="170" x2="570" y2="356" stroke="#e3e8ef" stroke-width="1"/>
  <line x1="690" y1="170" x2="690" y2="356" stroke="#e3e8ef" stroke-width="1"/>
  <line x1="810" y1="170" x2="810" y2="356" stroke="#e3e8ef" stroke-width="1"/>

  <!-- row 1: all 43.5 (30.8-61.6) -->
  <text x="318" y="192" font-size="12.5" text-anchor="end" fill="#24303f">all 12–17-year-olds</text>
  <rect x="330" y="176" width="174" height="22" fill="#2563eb"/>
  <line x1="453.2" y1="187" x2="576.4" y2="187" stroke="#1e3a8a" stroke-width="1.8"/>
  <line x1="453.2" y1="181" x2="453.2" y2="193" stroke="#1e3a8a" stroke-width="1.8"/>
  <line x1="576.4" y1="181" x2="576.4" y2="193" stroke="#1e3a8a" stroke-width="1.8"/>
  <text x="586" y="192" font-size="12.5" font-weight="700" fill="#1d4ed8">43.5</text>

  <!-- row 2: males 66.0 (40.5-107.7) -->
  <text x="318" y="228" font-size="12.5" text-anchor="end" fill="#24303f">males</text>
  <rect x="330" y="212" width="264" height="22" fill="#2563eb"/>
  <line x1="492" y1="223" x2="760.8" y2="223" stroke="#1e3a8a" stroke-width="1.8"/>
  <line x1="492" y1="217" x2="492" y2="229" stroke="#1e3a8a" stroke-width="1.8"/>
  <line x1="760.8" y1="217" x2="760.8" y2="229" stroke="#1e3a8a" stroke-width="1.8"/>
  <text x="770" y="228" font-size="12.5" font-weight="700" fill="#1d4ed8">66.0</text>

  <!-- row 3: females 10.1 (6.0-17.0) -->
  <text x="318" y="264" font-size="12.5" text-anchor="end" fill="#24303f">females</text>
  <rect x="330" y="248" width="40.4" height="22" fill="#93b4f5"/>
  <line x1="354" y1="259" x2="398" y2="259" stroke="#1e3a8a" stroke-width="1.8"/>
  <line x1="354" y1="253" x2="354" y2="265" stroke="#1e3a8a" stroke-width="1.8"/>
  <line x1="398" y1="253" x2="398" y2="265" stroke="#1e3a8a" stroke-width="1.8"/>
  <text x="408" y="264" font-size="12.5" font-weight="700" fill="#1d4ed8">10.1</text>

  <!-- row 4: after first dose 16.6 (8.7-31.9) -->
  <text x="318" y="300" font-size="12.5" text-anchor="end" fill="#24303f">after the first dose</text>
  <rect x="330" y="284" width="66.4" height="22" fill="#93b4f5"/>
  <line x1="364.8" y1="295" x2="457.6" y2="295" stroke="#1e3a8a" stroke-width="1.8"/>
  <line x1="364.8" y1="289" x2="364.8" y2="301" stroke="#1e3a8a" stroke-width="1.8"/>
  <line x1="457.6" y1="289" x2="457.6" y2="301" stroke="#1e3a8a" stroke-width="1.8"/>
  <text x="466" y="300" font-size="12.5" font-weight="700" fill="#1d4ed8">16.6</text>

  <!-- row 5: after second dose 60.4 (37.6-96.9) -->
  <text x="318" y="336" font-size="12.5" text-anchor="end" fill="#24303f">after the second dose</text>
  <rect x="330" y="320" width="241.6" height="22" fill="#2563eb"/>
  <line x1="480.4" y1="331" x2="717.6" y2="331" stroke="#1e3a8a" stroke-width="1.8"/>
  <line x1="480.4" y1="325" x2="480.4" y2="337" stroke="#1e3a8a" stroke-width="1.8"/>
  <line x1="717.6" y1="325" x2="717.6" y2="337" stroke="#1e3a8a" stroke-width="1.8"/>
  <text x="726" y="336" font-size="12.5" font-weight="700" fill="#1d4ed8">60.4</text>

  <!-- axis -->
  <line x1="330" y1="356" x2="810" y2="356" stroke="#8a95a5" stroke-width="1.4"/>
  <line x1="330" y1="356" x2="330" y2="362" stroke="#8a95a5"/><text x="330" y="376" font-size="11" text-anchor="middle" fill="#5b6879">0</text>
  <line x1="450" y1="356" x2="450" y2="362" stroke="#8a95a5"/><text x="450" y="376" font-size="11" text-anchor="middle" fill="#5b6879">30</text>
  <line x1="570" y1="356" x2="570" y2="362" stroke="#8a95a5"/><text x="570" y="376" font-size="11" text-anchor="middle" fill="#5b6879">60</text>
  <line x1="690" y1="356" x2="690" y2="362" stroke="#8a95a5"/><text x="690" y="376" font-size="11" text-anchor="middle" fill="#5b6879">90</text>
  <line x1="810" y1="356" x2="810" y2="362" stroke="#8a95a5"/><text x="810" y="376" font-size="11" text-anchor="middle" fill="#5b6879">120</text>
  <text x="570" y="396" font-size="12" text-anchor="middle" fill="#5b6879">myopericarditis cases per million vaccine doses</text>

  <!-- ================= PANEL B ================= -->
  <rect x="40" y="422" width="820" height="250" rx="12" fill="#f6f8fb" stroke="#d7dee8"/>
  <text x="62" y="452" font-size="16.5" font-weight="700" fill="#0f172a">B. United States reporting rates, 354 million doses, after the second dose</text>
  <text x="62" y="474" font-size="12.5" fill="#5b6879">Reports to a national passive-surveillance system; no confidence intervals were reported</text>

  <line x1="450" y1="490" x2="450" y2="624" stroke="#e3e8ef" stroke-width="1"/>
  <line x1="570" y1="490" x2="570" y2="624" stroke="#e3e8ef" stroke-width="1"/>
  <line x1="690" y1="490" x2="690" y2="624" stroke="#e3e8ef" stroke-width="1"/>
  <line x1="810" y1="490" x2="810" y2="624" stroke="#e3e8ef" stroke-width="1"/>

  <text x="318" y="510" font-size="12.5" text-anchor="end" fill="#24303f">males 12–15 (BNT162b2)</text>
  <rect x="330" y="494" width="282.8" height="22" fill="#2563eb"/>
  <text x="622" y="510" font-size="12.5" font-weight="700" fill="#1d4ed8">70.7</text>

  <text x="318" y="542" font-size="12.5" text-anchor="end" fill="#24303f">males 16–17 (BNT162b2)</text>
  <rect x="330" y="526" width="423.6" height="22" fill="#2563eb"/>
  <text x="763" y="542" font-size="12.5" font-weight="700" fill="#1d4ed8">105.9</text>

  <text x="318" y="574" font-size="12.5" text-anchor="end" fill="#24303f">men 18–24 (BNT162b2)</text>
  <rect x="330" y="558" width="209.6" height="22" fill="#93b4f5"/>
  <text x="549" y="574" font-size="12.5" font-weight="700" fill="#1d4ed8">52.4</text>

  <text x="318" y="606" font-size="12.5" text-anchor="end" fill="#24303f">men 18–24 (mRNA-1273)</text>
  <rect x="330" y="590" width="225.2" height="22" fill="#93b4f5"/>
  <text x="565" y="606" font-size="12.5" font-weight="700" fill="#1d4ed8">56.3</text>

  <line x1="330" y1="624" x2="810" y2="624" stroke="#8a95a5" stroke-width="1.4"/>
  <line x1="330" y1="624" x2="330" y2="630" stroke="#8a95a5"/><text x="330" y="644" font-size="11" text-anchor="middle" fill="#5b6879">0</text>
  <line x1="450" y1="624" x2="450" y2="630" stroke="#8a95a5"/><text x="450" y="644" font-size="11" text-anchor="middle" fill="#5b6879">30</text>
  <line x1="570" y1="624" x2="570" y2="630" stroke="#8a95a5"/><text x="570" y="644" font-size="11" text-anchor="middle" fill="#5b6879">60</text>
  <line x1="690" y1="624" x2="690" y2="630" stroke="#8a95a5"/><text x="690" y="644" font-size="11" text-anchor="middle" fill="#5b6879">90</text>
  <line x1="810" y1="624" x2="810" y2="630" stroke="#8a95a5"/><text x="810" y="644" font-size="11" text-anchor="middle" fill="#5b6879">120</text>
  <text x="570" y="664" font-size="12" text-anchor="middle" fill="#5b6879">myocarditis reports per million vaccine doses (same scale as panel A)</text>

  <!-- ================= PANEL C ================= -->
  <rect x="40" y="684" width="820" height="196" rx="12" fill="#fffbeb" stroke="#f0c974"/>
  <text x="62" y="714" font-size="16.5" font-weight="700" fill="#0f172a">C. The same illness is commoner after catching the virus than after the vaccine</text>
  <text x="62" y="736" font-size="12.5" fill="#5b6879">England, about 38 million people; extra cases in the 28 days after each event — a different denominator</text>

  <line x1="426" y1="752" x2="426" y2="838" stroke="#eadfc4" stroke-width="1"/>
  <line x1="522" y1="752" x2="522" y2="838" stroke="#eadfc4" stroke-width="1"/>
  <line x1="618" y1="752" x2="618" y2="838" stroke="#eadfc4" stroke-width="1"/>
  <line x1="714" y1="752" x2="714" y2="838" stroke="#eadfc4" stroke-width="1"/>
  <line x1="810" y1="752" x2="810" y2="838" stroke="#eadfc4" stroke-width="1"/>

  <text x="318" y="775" font-size="12.5" text-anchor="end" fill="#24303f">after a second mRNA-1273 dose</text>
  <rect x="330" y="758" width="96" height="24" fill="#2563eb"/>
  <text x="436" y="775" font-size="13" font-weight="700" fill="#1d4ed8">10 per million</text>

  <text x="318" y="811" font-size="12.5" text-anchor="end" fill="#24303f">after a positive test for the virus</text>
  <rect x="330" y="794" width="384" height="24" fill="#b91c1c"/>
  <text x="724" y="811" font-size="13" font-weight="700" fill="#991b1b">40 per million</text>

  <line x1="330" y1="838" x2="810" y2="838" stroke="#8a95a5" stroke-width="1.4"/>
  <line x1="330" y1="838" x2="330" y2="844" stroke="#8a95a5"/><text x="330" y="858" font-size="11" text-anchor="middle" fill="#5b6879">0</text>
  <line x1="426" y1="838" x2="426" y2="844" stroke="#8a95a5"/><text x="426" y="858" font-size="11" text-anchor="middle" fill="#5b6879">10</text>
  <line x1="522" y1="838" x2="522" y2="844" stroke="#8a95a5"/><text x="522" y="858" font-size="11" text-anchor="middle" fill="#5b6879">20</text>
  <line x1="618" y1="838" x2="618" y2="844" stroke="#8a95a5"/><text x="618" y="858" font-size="11" text-anchor="middle" fill="#5b6879">30</text>
  <line x1="714" y1="838" x2="714" y2="844" stroke="#8a95a5"/><text x="714" y="858" font-size="11" text-anchor="middle" fill="#5b6879">40</text>
  <line x1="810" y1="838" x2="810" y2="844" stroke="#8a95a5"/><text x="810" y="858" font-size="11" text-anchor="middle" fill="#5b6879">50</text>
  <text x="570" y="876" font-size="12" text-anchor="middle" fill="#5b6879">extra myocarditis cases per million people (note: a different scale from panels A and B)</text>

  <!-- ================= STRIP D ================= -->
  <rect x="40" y="892" width="820" height="86" rx="12" fill="#ecfdf5" stroke="#8fd6bd"/>
  <text x="62" y="920" font-size="14.5" font-weight="700" fill="#0f172a">What happened to the patients (US cases under 30 years old)</text>
  <text x="62" y="945" font-size="12.5" fill="#24303f">Median age 21 · symptoms began a median of 2 days after the dose · 96% were admitted to hospital ·</text>
  <text x="62" y="964" font-size="12.5" fill="#24303f">87% had their presenting symptoms resolve by the time they were discharged.</text>

  <!-- ================= GLOSSARY ================= -->
  <rect x="40" y="990" width="820" height="205" rx="12" fill="#f2f5fa" stroke="#c9d4e2"/>
  <text x="62" y="1018" font-size="14" font-weight="700" fill="#0f172a">Glossary — plain-language meaning of every term in this figure</text>

  <text x="62" y="1042" font-size="12" fill="#24303f"><tspan font-weight="700">Myocarditis / pericarditis</tspan> — inflammation of the heart muscle</text>
  <text x="62" y="1058" font-size="12" fill="#24303f">or of the sac around it; usually causes chest pain and settles</text>
  <text x="62" y="1074" font-size="12" fill="#24303f">within days. Myopericarditis means either or both.</text>
  <text x="62" y="1094" font-size="12" fill="#24303f"><tspan font-weight="700">Per million doses</tspan> (panels A and B) — cases counted against</text>
  <text x="62" y="1110" font-size="12" fill="#24303f">every dose given, so a two-dose course counts twice.</text>
  <text x="62" y="1130" font-size="12" fill="#24303f"><tspan font-weight="700">Per million people</tspan> (panel C) — cases counted against people</text>
  <text x="62" y="1146" font-size="12" fill="#24303f">in a 28-day window. The two cannot be read off one scale, which</text>
  <text x="62" y="1162" font-size="12" fill="#24303f">is why panel C has its own axis.</text>

  <text x="470" y="1042" font-size="12" fill="#24303f"><tspan font-weight="700">95% confidence interval</tspan> — the range the true rate plausibly</text>
  <text x="470" y="1058" font-size="12" fill="#24303f">lies in; the thin line through each bar in panel A.</text>
  <text x="470" y="1078" font-size="12" fill="#24303f"><tspan font-weight="700">Passive surveillance</tspan> (panel B) — anyone may file a report, so</text>
  <text x="470" y="1094" font-size="12" fill="#24303f">cases are undercounted and rates are not directly comparable</text>
  <text x="470" y="1110" font-size="12" fill="#24303f">with the pooled study rates in panel A.</text>
  <text x="470" y="1130" font-size="12" fill="#24303f"><tspan font-weight="700">BNT162b2, mRNA-1273</tspan> — the two licensed COVID-19 mRNA</text>
  <text x="470" y="1146" font-size="12" fill="#24303f">vaccines. <tspan font-weight="700">Pale blue bars</tspan> mark the lower-rate groups; the red</text>
  <text x="470" y="1162" font-size="12" fill="#24303f">bar in panel C marks risk from the infection, not the vaccine.</text>
</svg>
