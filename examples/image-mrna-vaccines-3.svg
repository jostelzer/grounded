<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="900" viewBox="0 0 1000 900" role="img" aria-labelledby="title desc">
  <title id="title">Myocarditis risk is rare and concentrated by sex, dose and product</title>
  <desc id="desc">Two explicitly non-comparable interval plots. The first gives pooled myocarditis cases per million adolescent doses by sex and dose number. The second gives excess cases per million vaccinated Nordic males age 16 to 24 after a second dose, comparing BNT162b2 and mRNA-1273. Confidence intervals and denominator cautions are shown.</desc>
  <defs>
    <style>
      .bg{fill:#f7f4ed}.ink{fill:#17324d}.muted{fill:#587085}.title{font:700 38px Arial,sans-serif}.subtitle{font:400 20px Arial,sans-serif}.head{font:700 21px Arial,sans-serif}.label{font:600 17px Arial,sans-serif}.body{font:400 16px Arial,sans-serif}.small{font:400 14px Arial,sans-serif}.gloss{font:400 18px Arial,sans-serif}.glosshead{font:700 19px Arial,sans-serif}.grid{stroke:#d5dee5;stroke-width:2}.axis{stroke:#6c8191;stroke-width:3}.ci{stroke:#17324d;stroke-width:5;stroke-linecap:round}.cap{stroke:#17324d;stroke-width:3}.bar1{fill:#177e89}.bar2{fill:#3366a8}.bar3{fill:#c85d78}.bar4{fill:#e6a23c}
    </style>
  </defs>
  <rect class="bg" width="1000" height="900"/>
  <g id="title-band">
    <text class="title ink" x="50" y="52">Myocarditis risk is concentrated, not uniform</text>
    <text class="subtitle muted" x="50" y="82">Two datasets · compare within each panel only · whiskers are 95% confidence intervals</text>
    <line x1="50" y1="102" x2="950" y2="102" stroke="#9eb2c1" stroke-width="2"/>
  </g>

  <g id="adolescent-panel">
    <rect x="50" y="130" width="475" height="465" rx="18" fill="#fff" stroke="#c8d5df" stroke-width="2"/>
    <text class="head ink" x="75" y="165">A · Pooled adolescents, age 12-17</text>
    <text class="body muted" x="75" y="192">Cases per million vaccine doses</text>
    <text class="small muted" x="75" y="216">15 observational studies · 39.6 million doses</text>

    <line class="grid" x1="180" y1="240" x2="180" y2="515"/>
    <line class="grid" x1="305" y1="240" x2="305" y2="515"/>
    <line class="grid" x1="430" y1="240" x2="430" y2="515"/>
    <line class="axis" x1="180" y1="515" x2="480" y2="515"/>
    <text class="small muted" x="180" y="540" text-anchor="middle">0</text>
    <text class="small muted" x="305" y="540" text-anchor="middle">50</text>
    <text class="small muted" x="430" y="540" text-anchor="middle">100</text>

    <text class="label ink" x="165" y="275" text-anchor="end">Male</text>
    <rect class="bar1" x="180" y="257" width="165" height="22" rx="5" opacity="0.75"/>
    <line class="ci" x1="281" y1="268" x2="449" y2="268"/><line class="cap" x1="281" y1="258" x2="281" y2="278"/><line class="cap" x1="449" y1="258" x2="449" y2="278"/>
    <circle cx="345" cy="268" r="9" fill="#177e89" stroke="#fff" stroke-width="3"/>
    <text class="small ink" x="352" y="250">66.0</text>

    <text class="label ink" x="165" y="345" text-anchor="end">Female</text>
    <rect class="bar2" x="180" y="327" width="25" height="22" rx="5" opacity="0.75"/>
    <line class="ci" x1="195" y1="338" x2="223" y2="338"/><line class="cap" x1="195" y1="328" x2="195" y2="348"/><line class="cap" x1="223" y1="328" x2="223" y2="348"/>
    <circle cx="205" cy="338" r="9" fill="#3366a8" stroke="#fff" stroke-width="3"/>
    <text class="small ink" x="220" y="320">10.1</text>

    <text class="label ink" x="165" y="415" text-anchor="end">Dose 2</text>
    <rect class="bar3" x="180" y="397" width="151" height="22" rx="5" opacity="0.75"/>
    <line class="ci" x1="274" y1="408" x2="422" y2="408"/><line class="cap" x1="274" y1="398" x2="274" y2="418"/><line class="cap" x1="422" y1="398" x2="422" y2="418"/>
    <circle cx="331" cy="408" r="9" fill="#c85d78" stroke="#fff" stroke-width="3"/>
    <text class="small ink" x="339" y="390">60.4</text>

    <text class="label ink" x="165" y="485" text-anchor="end">Dose 1</text>
    <rect class="bar4" x="180" y="467" width="42" height="22" rx="5" opacity="0.75"/>
    <line class="ci" x1="202" y1="478" x2="260" y2="478"/><line class="cap" x1="202" y1="468" x2="202" y2="488"/><line class="cap" x1="260" y1="468" x2="260" y2="488"/>
    <circle cx="222" cy="478" r="9" fill="#e6a23c" stroke="#fff" stroke-width="3"/>
    <text class="small ink" x="237" y="460">16.6</text>

    <text class="small muted" x="75" y="572">Sex and dose are separate pooled subgroup analyses.</text>
  </g>

  <g id="nordic-panel">
    <rect x="545" y="130" width="405" height="465" rx="18" fill="#fff" stroke="#c8d5df" stroke-width="2"/>
    <text class="head ink" x="570" y="165">B · Nordic males, age 16-24</text>
    <text class="body muted" x="570" y="192">Excess cases per million vaccinated after dose 2</text>
    <text class="small muted" x="570" y="216">Four linked national cohorts · 28-day window</text>

    <line class="grid" x1="660" y1="250" x2="660" y2="480"/>
    <line class="grid" x1="750" y1="250" x2="750" y2="480"/>
    <line class="grid" x1="840" y1="250" x2="840" y2="480"/>
    <line class="grid" x1="930" y1="250" x2="930" y2="480"/>
    <line class="axis" x1="660" y1="480" x2="930" y2="480"/>
    <text class="small muted" x="660" y="505" text-anchor="middle">0</text>
    <text class="small muted" x="750" y="505" text-anchor="middle">100</text>
    <text class="small muted" x="840" y="505" text-anchor="middle">200</text>
    <text class="small muted" x="930" y="505" text-anchor="middle">300</text>

    <text class="label ink" x="645" y="315" text-anchor="end">BNT162b2</text>
    <rect class="bar2" x="660" y="297" width="50" height="24" rx="5" opacity="0.75"/>
    <line class="ci" x1="693" y1="309" x2="727" y2="309"/><line class="cap" x1="693" y1="298" x2="693" y2="320"/><line class="cap" x1="727" y1="298" x2="727" y2="320"/>
    <circle cx="710" cy="309" r="10" fill="#3366a8" stroke="#fff" stroke-width="3"/>
    <text class="small ink" x="724" y="290">55.5</text>

    <text class="label ink" x="645" y="425" text-anchor="end">mRNA-1273</text>
    <rect class="bar3" x="660" y="407" width="166" height="24" rx="5" opacity="0.75"/>
    <line class="ci" x1="741" y1="419" x2="910" y2="419"/><line class="cap" x1="741" y1="408" x2="741" y2="430"/><line class="cap" x1="910" y1="408" x2="910" y2="430"/>
    <circle cx="826" cy="419" r="10" fill="#c85d78" stroke="#fff" stroke-width="3"/>
    <text class="small ink" x="840" y="400">183.9</text>

    <rect x="570" y="530" width="355" height="42" rx="10" fill="#fff3dc"/>
    <text class="small ink" x="747" y="556" text-anchor="middle">Do not compare these bar lengths with panel A.</text>
  </g>

  <g id="glossary-band">
    <rect x="50" y="635" width="900" height="220" rx="16" fill="#eef1f2" stroke="#b8c7d1" stroke-width="2"/>
    <text class="glosshead ink" x="75" y="669">GLOSSARY, DENOMINATORS AND UNCERTAINTY</text>
    <text class="gloss ink" x="75" y="703"><tspan font-weight="700">Myocarditis</tspan><tspan> · inflammation of heart muscle; studies may combine it with pericarditis.</tspan></text>
    <text class="gloss ink" x="75" y="735"><tspan font-weight="700">Panel A rate</tspan><tspan> · observed cases per million vaccine doses, pooled across heterogeneous studies.</tspan></text>
    <text class="gloss ink" x="75" y="767"><tspan font-weight="700">Panel B excess</tspan><tspan> · cases above the estimated background per million vaccinated people in a 28-day window.</tspan></text>
    <text class="gloss ink" x="75" y="799"><tspan font-weight="700">95% confidence interval</tspan><tspan> · the whisker around each dot; wider intervals mean greater statistical uncertainty.</tspan></text>
    <text class="gloss ink" x="75" y="831"><tspan font-weight="700">BNT162b2 / mRNA-1273</tspan><tspan> · two different mRNA vaccine products with different doses and formulations.</tspan></text>
  </g>
</svg>
