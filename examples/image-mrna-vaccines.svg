<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="930" viewBox="0 0 1000 930" role="img" aria-labelledby="title desc">
  <title id="title">From a short-lived mRNA recipe to immune memory</title>
  <desc id="desc">A four-stage mechanism map: lipid nanoparticle delivery, transient antigen production in a cell, mainly mouse-derived innate sensing in a draining lymph node, and observed human antibody, memory B-cell and T-cell responses. A glossary defines every technical term and the dashed uncertainty encoding.</desc>
  <defs>
    <style>
      .bg{fill:#f7f4ed}.ink{fill:#17324d}.muted{fill:#587085}.panel{fill:#ffffff;stroke:#c8d5df;stroke-width:2}.accent{fill:#177e89}.blue{fill:#3366a8}.amber{fill:#e6a23c}.rose{fill:#c85d78}.softblue{fill:#eaf2fb}.softteal{fill:#e5f3f1}.softamber{fill:#fff3dc}.softrose{fill:#f9e8ed}.title{font:700 38px Arial,sans-serif}.subtitle{font:400 20px Arial,sans-serif}.step{font:700 21px Arial,sans-serif}.label{font:600 18px Arial,sans-serif}.body{font:400 17px Arial,sans-serif}.small{font:400 15px Arial,sans-serif}.gloss{font:400 18px Arial,sans-serif}.glosshead{font:700 19px Arial,sans-serif}.arrow{stroke:#587085;stroke-width:4;fill:none;stroke-linecap:round;stroke-linejoin:round}.dash{stroke:#d08a23;stroke-width:3;stroke-dasharray:9 7;fill:#fffaf0}
    </style>
    <marker id="arrow" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto"><path d="M0,0 L10,5.5 L0,11 Z" fill="#587085"/></marker>
  </defs>
  <rect class="bg" width="1000" height="930"/>

  <g id="title-band">
    <text id="figure-title" class="title ink" x="50" y="52">From a short-lived recipe to immune memory</text>
    <text class="subtitle muted" x="50" y="82">Solid panels: observed in people · Dashed panel: pathway detail mainly from mice</text>
    <line x1="50" y1="102" x2="950" y2="102" stroke="#9eb2c1" stroke-width="2"/>
  </g>

  <g id="body">
    <rect class="panel" x="50" y="130" width="205" height="510" rx="18"/>
    <circle cx="152" cy="245" r="72" fill="#e5f3f1" stroke="#177e89" stroke-width="4"/>
    <circle cx="126" cy="218" r="13" fill="#177e89"/><circle cx="175" cy="214" r="11" fill="#3366a8"/><circle cx="183" cy="263" r="14" fill="#e6a23c"/><circle cx="128" cy="274" r="10" fill="#c85d78"/>
    <path d="M108 244 C120 226 132 266 144 244 S168 226 180 244 S202 260 208 241" fill="none" stroke="#17324d" stroke-width="5" stroke-linecap="round"/>
    <text class="step ink" x="152" y="156" text-anchor="middle">1 · Package</text>
    <text class="label ink" x="152" y="346" text-anchor="middle">Modified mRNA</text>
    <text class="body muted" x="152" y="375" text-anchor="middle"><tspan x="152">is protected inside</tspan><tspan x="152" dy="23">a lipid nanoparticle</tspan></text>
    <rect x="75" y="455" width="155" height="106" rx="12" class="softteal"/>
    <text class="small ink" x="152" y="486" text-anchor="middle"><tspan x="152">No pathogen</tspan><tspan x="152" dy="22">No DNA step</tspan><tspan x="152" dy="22">Sequence can change</tspan></text>

    <path class="arrow" d="M263 345 H295" marker-end="url(#arrow)"/>
    <text class="small muted" x="279" y="326" text-anchor="middle">enters</text>

    <rect class="panel" x="305" y="130" width="205" height="510" rx="18"/>
    <text class="step ink" x="407" y="156" text-anchor="middle">2 · Translate</text>
    <path d="M347 229 C347 184 391 168 424 185 C461 165 493 196 486 235 C495 282 455 315 409 306 C370 320 335 286 347 229 Z" fill="#eaf2fb" stroke="#3366a8" stroke-width="4"/>
    <path d="M362 245 C376 224 388 267 402 245 S427 226 441 245" fill="none" stroke="#17324d" stroke-width="4"/>
    <ellipse cx="447" cy="244" rx="21" ry="14" fill="#e6a23c" stroke="#aa6e14" stroke-width="2"/>
    <path d="M457 230 L478 205 M457 230 L483 229 M457 230 L476 254" stroke="#c85d78" stroke-width="5" stroke-linecap="round"/>
    <text class="label ink" x="407" y="346" text-anchor="middle">Cell makes antigen</text>
    <text class="body muted" x="407" y="375" text-anchor="middle"><tspan x="407">Ribosomes read the</tspan><tspan x="407" dy="23">recipe in the cytoplasm</tspan></text>
    <rect x="330" y="455" width="155" height="106" rx="12" class="softblue"/>
    <text class="small ink" x="407" y="486" text-anchor="middle"><tspan x="407">Expression is brief</tspan><tspan x="407" dy="22">Antigen is displayed</tspan><tspan x="407" dy="22">RNA is degraded</tspan></text>

    <path class="arrow" d="M518 345 H550" marker-end="url(#arrow)"/>
    <text class="small muted" x="534" y="326" text-anchor="middle">alerts</text>

    <rect class="dash" x="560" y="130" width="205" height="510" rx="18"/>
    <text class="step ink" x="662" y="156" text-anchor="middle">3 · Signal</text>
    <path d="M610 213 C633 183 691 183 714 213 C737 243 712 291 662 304 C612 291 587 243 610 213 Z" fill="#fff3dc" stroke="#e6a23c" stroke-width="4"/>
    <circle cx="637" cy="235" r="14" fill="#177e89"/><circle cx="687" cy="234" r="14" fill="#3366a8"/><circle cx="662" cy="272" r="15" fill="#c85d78"/>
    <path d="M620 326 Q662 298 704 326" fill="none" stroke="#e6a23c" stroke-width="5"/>
    <text class="label ink" x="662" y="363" text-anchor="middle">Draining lymph node</text>
    <text class="body muted" x="662" y="392" text-anchor="middle"><tspan x="662">Innate sensors and</tspan><tspan x="662" dy="23">immune cells coordinate</tspan></text>
    <rect x="585" y="455" width="155" height="106" rx="12" class="softamber"/>
    <text class="small ink" x="662" y="486" text-anchor="middle"><tspan x="662">Lipid also acts</tspan><tspan x="662" dy="22">as an immune alarm</tspan><tspan x="662" dy="22">Pathway varies</tspan></text>

    <path class="arrow" d="M773 345 H805" marker-end="url(#arrow)"/>
    <text class="small muted" x="789" y="326" text-anchor="middle">trains</text>

    <rect class="panel" x="815" y="130" width="135" height="510" rx="18"/>
    <text class="step ink" x="882" y="156" text-anchor="middle">4 · Memory</text>
    <circle cx="882" cy="218" r="34" fill="#f9e8ed" stroke="#c85d78" stroke-width="4"/>
    <path d="M862 219 Q882 192 902 219 Q882 246 862 219" fill="none" stroke="#c85d78" stroke-width="4"/>
    <rect x="835" y="282" width="95" height="75" rx="12" class="softrose"/>
    <text class="small ink" x="882" y="310" text-anchor="middle"><tspan x="882">Antibodies</tspan><tspan x="882" dy="21">block entry</tspan></text>
    <rect x="835" y="375" width="95" height="75" rx="12" class="softteal"/>
    <text class="small ink" x="882" y="403" text-anchor="middle"><tspan x="882">Memory</tspan><tspan x="882" dy="21">B cells</tspan></text>
    <rect x="835" y="468" width="95" height="75" rx="12" class="softblue"/>
    <text class="small ink" x="882" y="496" text-anchor="middle"><tspan x="882">Helper and</tspan><tspan x="882" dy="21">killer T cells</tspan></text>
    <text class="small muted" x="882" y="583" text-anchor="middle"><tspan x="882">Lymph-node activity:</tspan><tspan x="882" dy="20">12 weeks to 6 months</tspan></text>
  </g>

  <g id="glossary-band">
    <rect x="50" y="670" width="900" height="230" rx="16" fill="#eef1f2" stroke="#b8c7d1" stroke-width="2"/>
    <text class="glosshead ink" x="75" y="704">GLOSSARY AND ENCODING</text>
    <text class="gloss ink" x="75" y="738"><tspan font-weight="700">mRNA</tspan><tspan> · messenger RNA, a temporary protein recipe.</tspan></text>
    <text class="gloss ink" x="75" y="770"><tspan font-weight="700">Lipid nanoparticle</tspan><tspan> · a tiny fat-based carrier that protects and delivers RNA.</tspan></text>
    <text class="gloss ink" x="75" y="802"><tspan font-weight="700">Antigen</tspan><tspan> · the protein feature the immune system learns to recognize.</tspan></text>
    <text class="gloss ink" x="75" y="834"><tspan font-weight="700">Germinal centre</tspan><tspan> · a lymph-node training site where antibody-producing B cells improve.</tspan></text>
    <text class="gloss ink" x="75" y="866"><tspan font-weight="700">Dashed amber panel</tspan><tspan> · detailed pathway supported mainly by mouse experiments;</tspan><tspan x="75" dy="24">human relevance is plausible but incomplete.</tspan></text>
  </g>
</svg>
