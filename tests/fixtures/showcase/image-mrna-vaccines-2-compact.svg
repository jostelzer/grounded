<svg xmlns="http://www.w3.org/2000/svg" width="1536" height="520" viewBox="0 0 1536 520" role="img" aria-labelledby="title desc">
  <title id="title">Protection wanes faster against infection than severe disease</title>
  <desc id="desc">A compact evidence figure compares the average month-one-to-month-six decline in protection against infection and severe disease, with confidence intervals, and lists circulating memory, the airway immunity gap, and variant escape as supported but unpartitioned explanations.</desc>
  <defs>
    <style>
      .ink{fill:#202124}.muted{fill:#666a70}.blue{fill:#376f9e}.green{fill:#45815b}
      .rule{stroke:#b8bcc1;stroke-width:2}
      text{font-family:Arial,Helvetica,sans-serif}.eyebrow{font-size:22px;font-weight:700;letter-spacing:3px}.label{font-size:37px;font-weight:700}.value{font-size:66px;font-weight:700}.unit{font-size:29px;font-weight:400}.detail{font-size:25px;font-weight:400}.head{font-size:29px;font-weight:700}.body{font-size:24px;font-weight:400}.note{font-size:21px;font-weight:400}
    </style>
  </defs>
  <rect width="1536" height="520" fill="#fff"/>
  <line class="rule" x1="34" y1="43" x2="1502" y2="43"/>
  <text class="eyebrow muted" x="42" y="31">AVERAGE DECLINE · MONTH 1 TO MONTH 6</text>

  <g aria-label="Average decline estimates">
    <line class="rule" x1="768" y1="62" x2="768" y2="446"/>
    <line class="rule" x1="42" y1="254" x2="728" y2="254"/>
    <circle class="blue" cx="78" cy="137" r="14"/>
    <text class="label ink" x="111" y="130">Infection</text>
    <text class="value ink" x="111" y="206">21.0</text>
    <text class="unit ink" x="275" y="202">percentage points</text>
    <text class="detail muted" x="519" y="202">95% CI 13.9–29.8</text>
    <circle class="green" cx="78" cy="329" r="14"/>
    <text class="label ink" x="111" y="322">Severe disease</text>
    <text class="value ink" x="111" y="398">10.0</text>
    <text class="unit ink" x="275" y="394">percentage points</text>
    <text class="detail muted" x="519" y="394">95% CI 6.1–15.4</text>
  </g>

  <g aria-label="Supported explanations">
    <text class="eyebrow muted" x="810" y="92">SUPPORTED · NOT QUANTITATIVELY PARTITIONED</text>
    <circle cx="838" cy="159" r="22" fill="#e7f1e9" stroke="#45815b" stroke-width="3"/>
    <circle cx="838" cy="159" r="8" class="green"/>
    <text class="head ink" x="882" y="151">Circulating memory</text>
    <text class="body muted" x="882" y="184">B and T cells can limit progression after infection.</text>
    <rect x="816" y="242" width="44" height="44" rx="8" fill="#f8ece9" stroke="#9a4f43" stroke-width="3"/>
    <path d="M816 235h44M821 225v14M830 225v14M839 225v14M848 225v14M857 225v14" fill="none" stroke="#9a4f43" stroke-width="3"/>
    <text class="head ink" x="882" y="255">Airway gap</text>
    <text class="body muted" x="882" y="288">Injected vaccine elicits weaker local airway immunity.</text>
    <circle cx="838" cy="367" r="22" fill="#eceaf8" stroke="#5f5794" stroke-width="3"/>
    <path d="M838 333v14M838 387v14M804 367h14M858 367h14M814 343l10 10M852 381l10 10M862 343l-10 10M824 381l-10 10" stroke="#5f5794" stroke-width="5" stroke-linecap="round"/>
    <text class="head ink" x="882" y="359">Variant escape</text>
    <text class="body muted" x="882" y="392">Changed antigen can evade previously matched antibodies.</text>
  </g>

  <line class="rule" x1="34" y1="446" x2="1502" y2="446"/>
  <text class="note muted" x="42" y="485">Equal row size does not encode magnitude · CI = confidence interval · Evidence preceded widespread Omicron</text>
</svg>
